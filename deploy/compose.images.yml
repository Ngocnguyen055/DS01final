name: ds01
services:
  signaling:
    image: ${DS01_IMAGE_PREFIX:?Set DS01_IMAGE_PREFIX}/app:${DS01_IMAGE_TAG:?Set DS01_IMAGE_TAG}
    environment:
      NODE_ENV: production
      NODE_ID: signaling
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      PEER_SECRET: ${PEER_SECRET:?Set PEER_SECRET}
      SIGNAL_STATE_PATH: /app/.data/signaling.json
    ports: ["127.0.0.1:4001:4001"]
    volumes: [signal-state:/app/.data]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  relay:
    image: ${DS01_IMAGE_PREFIX:?Set DS01_IMAGE_PREFIX}/app:${DS01_IMAGE_TAG:?Set DS01_IMAGE_TAG}
    command: ["npm", "run", "start:relay"]
    environment:
      NODE_ENV: production
      NODE_ID: relay-primary
      PEER_SECRET: ${PEER_SECRET:?Set PEER_SECRET}
      SIGNAL_INTERNAL_URL: http://signaling:4001
      RELAY_OFFLINE_QUEUE: "1"
      RELAY_STATE_PATH: /app/.data/relay.json
      RELAY_PUBLIC_URL: ${PUBLIC_RELAY_URL:-http://localhost:4002}
      RELAY_CLUSTER_URLS: ${PUBLIC_RELAY_URL:-http://localhost:4002},${PUBLIC_RELAY_BACKUP_URL:-http://localhost:4003}
      RELAY_CLUSTER_ROUTES: '{"${PUBLIC_RELAY_URL:-http://localhost:4002}":"http://relay:4002","${PUBLIC_RELAY_BACKUP_URL:-http://localhost:4003}":"http://relay-backup:4003"}'
      SUPER_PEER_ID: ${SUPER_PEER_ID:-}
    ports: ["127.0.0.1:4002:4002"]
    volumes: [relay-state:/app/.data]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  relay-backup:
    image: ${DS01_IMAGE_PREFIX:?Set DS01_IMAGE_PREFIX}/app:${DS01_IMAGE_TAG:?Set DS01_IMAGE_TAG}
    command: ["npm", "run", "start:relay"]
    environment:
      NODE_ENV: production
      NODE_ID: relay-backup
      PEER_SECRET: ${PEER_SECRET:?Set PEER_SECRET}
      SIGNAL_INTERNAL_URL: http://signaling:4001
      RELAY_PORT: "4003"
      RELAY_OFFLINE_QUEUE: "1"
      RELAY_STATE_PATH: /app/.data/relay.json
      RELAY_PUBLIC_URL: ${PUBLIC_RELAY_BACKUP_URL:-http://localhost:4003}
      RELAY_CLUSTER_URLS: ${PUBLIC_RELAY_URL:-http://localhost:4002},${PUBLIC_RELAY_BACKUP_URL:-http://localhost:4003}
      RELAY_CLUSTER_ROUTES: '{"${PUBLIC_RELAY_URL:-http://localhost:4002}":"http://relay:4002","${PUBLIC_RELAY_BACKUP_URL:-http://localhost:4003}":"http://relay-backup:4003"}'
      SUPER_PEER_ID: ${SUPER_PEER_BACKUP_ID:-}
    ports: ["127.0.0.1:4003:4003"]
    volumes: [relay-backup-state:/app/.data]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  web:
    image: ${DS01_IMAGE_PREFIX:?Set DS01_IMAGE_PREFIX}/web:${DS01_IMAGE_TAG:?Set DS01_IMAGE_TAG}
    ports: ["127.0.0.1:8080:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  signal-state:
  relay-state:
  relay-backup-state:
